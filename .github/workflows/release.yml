name: Build client APKs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64, variant: Arm64, androidAbi: arm64-v8a }
          - { abi: x64, variant: X64, androidAbi: x86_64 }
          - { abi: armv7, variant: Armv7, androidAbi: armeabi-v7a }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/init-submodules-with-retry
      - uses: ./.github/actions/setup-toolchain
      - name: Test and build
        run: ./gradlew testDebugUnitTest :app:test${{ matrix.variant }}FullDebugUnitTest :app:assemble${{ matrix.variant }}FullRelease -PtargetAbi=${{ matrix.abi }} --max-workers=2
      - name: Verify APK
        run: |
          ./scripts/check-native-libs.sh ${{ matrix.abi }}
          ./scripts/check-r8-kept-classes.sh app/build/outputs/mapping/${{ matrix.abi }}FullRelease/mapping.txt
          python3 scripts/check-client-apk.py app/build/outputs/apk/${{ matrix.abi }}Full/release/*.apk --abi ${{ matrix.androidAbi }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: haven-client-${{ matrix.abi }}-unsigned
          path: |
            app/build/outputs/apk/${{ matrix.abi }}Full/release/*.apk
            app/build/outputs/mapping/${{ matrix.abi }}FullRelease/mapping.txt
